apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: llm-d-e2e-matrix-leg
spec:
  params:
    - name: runner_image
      type: string
    - name: vllm_image
      type: string
    - name: model_spec
      type: string
    - name: namespace
      type: string
    - name: cleanup_on_failure
      type: string
      default: "true"
    - name: readiness-timeout
      type: string
      default: 30m
  workspaces:
    - name: results
  results:
    - name: test-status
      description: PASS or TEST_FAILURE or INFRASTRUCTURE_FAILURE
  steps:
    - name: deploy-and-test
      image: $(params.runner_image)
      env:
        - name: VLLM_IMAGE
          value: $(params.vllm_image)
        - name: MODEL_SPEC
          value: $(params.model_spec)
        - name: NAMESPACE
          value: $(params.namespace)
        - name: CLEANUP_ON_FAILURE
          value: $(params.cleanup_on_failure)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        leg_dir="$(workspaces.results.path)/$(context.taskRun.name)"
        report_dir="$leg_dir/reports"
        mkdir -p "$leg_dir"
        SERVICE_NAME="$(context.taskRun.name)-llmisvc"
        mkdir -p "$report_dir"
        status=INFRASTRUCTURE_FAILURE
        cleanup() {
          if [ "$status" = "PASS" ] || [ "$CLEANUP_ON_FAILURE" = "true" ]; then
            kubectl delete llminferenceservice "$SERVICE_NAME" -n "$NAMESPACE" \
              --ignore-not-found --wait=false >/dev/null 2>&1 || true
          else
            echo "Preserving $SERVICE_NAME for failure investigation"
          fi
          printf "%s" "$status" > "$(results.test-status.path)"
        }
        trap cleanup EXIT

        python -m conformance.render \
          --source tekton/manifests/single-gpu-smoke.yaml \
          --destination "$report_dir/llmisvc.yaml" \
          --name "$SERVICE_NAME" \
          --namespace "$NAMESPACE" \
          --model-spec "$MODEL_SPEC" \
          --vllm-image "$VLLM_IMAGE"
        kubectl apply -f "$report_dir/llmisvc.yaml"
        kubectl wait --for=condition=Ready=True \
          --timeout="$(params.readiness-timeout)" "llminferenceservice/$SERVICE_NAME" -n "$NAMESPACE" || exit 1

        model_uri="$(python -c 'import json, os; print(json.loads(os.environ["MODEL_SPEC"])["uri"])')"
        model_name="$(python -c 'import json, os; from conformance.render import model_name_for_variant; print(model_name_for_variant(json.loads(os.environ["MODEL_SPEC"])["uri"], os.environ["VLLM_IMAGE"]))')"
        rc=1
        for attempt in 1 2 3 4 5; do
          echo "Starting llm-d-e2e attempt $attempt/5"
          set +e
          llm-d-e2e \
            --profile configs/profiles/smoke.yaml \
            --mode discover \
            --namespace "$NAMESPACE" \
            --service-name "$SERVICE_NAME" \
            --model-uri "$model_uri" \
            --model "$model_name" \
            --nocleanup \
            --report-dir "$report_dir" \
            --junitxml "$report_dir/junit-$attempt.xml" 2>&1 | tee "$report_dir/e2e-$attempt.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            cp "$report_dir/junit-$attempt.xml" "$report_dir/junit.xml"
            break
          fi
          echo "llm-d-e2e attempt $attempt failed with exit code $rc"
          echo "=== LLMInferenceService status ==="
          kubectl get llminferenceservice "$SERVICE_NAME" -n "$NAMESPACE" -o yaml || true
          echo "=== Generated pods ==="
          kubectl get pods -n "$NAMESPACE" -o wide || true
          echo "=== Recent serving-pod logs ==="
          kubectl logs -n "$NAMESPACE" -l "serving.kserve.io/inferenceservice=$SERVICE_NAME" \
            --all-containers=true --prefix=true --tail=100 || true
          echo "=== Recent namespace events ==="
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp || true
          if [ "$attempt" -lt 5 ]; then
            sleep 15
          fi
        done
        if [ "$rc" -eq 0 ]; then
          status=PASS
        else
          status=TEST_FAILURE
        fi
        exit "$rc"
