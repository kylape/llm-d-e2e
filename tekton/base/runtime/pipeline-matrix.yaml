apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-e2e-matrix
spec:
  description: Run each vLLM image and complete model specification combination.
  params:
    - name: runner_image
      type: string
      description: Immutable runner image containing llm-d-e2e.
    - name: namespace
      type: string
      default: klape-llm-d-e2e
    - name: retain_on_failure
      type: string
      default: "false"
      description: Preserve failed-leg workloads when true.
  workspaces:
    - name: results
  tasks:
    - name: qualify
      matrix:
        params:
          - name: vllm_image
            value:
              - quay.io/aipcc/rhaiis/cuda-ubi9:3.5
              - quay.io/aipcc/rhaiis/cuda-ubi9:3.6.0-fast.1
          - name: model_spec
            value:
              - '{"name":"qwen3-0.6b-single-gpu","uri":"hf://Qwen/Qwen3-0.6B","gpu_count":1,"tensor_parallel_size":1,"vllm_args":[]}'
              - '{"name":"mixtral-8x7b-tp2","uri":"hf://mistralai/Mixtral-8x7B-Instruct-v0.1","gpu_count":2,"tensor_parallel_size":2,"vllm_args":[]}'
      taskRef:
        name: llm-d-e2e-matrix-leg
      params:
        - name: runner_image
          value: $(params.runner_image)
        - name: namespace
          value: $(params.namespace)
        - name: retain_on_failure
          value: $(params.retain_on_failure)
      workspaces:
        - name: results
          workspace: results
