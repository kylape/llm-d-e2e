apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-e2e-smoke
spec:
  params:
    - name: vllm_image
      type: string
      description: Immutable vLLM image reference for the main container
    - name: model
      type: string
      description: Model URI, for example hf://Qwen/Qwen3-0.6B
    - name: readiness_timeout
      type: string
      default: 20m
      description: Optional readiness timeout for negative-path validation
    - name: test_model
      type: string
      default: ""
      description: Optional model name override for negative-path validation
  workspaces:
    - name: results
  tasks:
    - name: deploy
      taskRef:
        name: llm-d-e2e-deploy
      params:
        - name: vllm_image
          value: $(params.vllm_image)
        - name: model
          value: $(params.model)
        - name: service-name
          value: $(context.pipelineRun.name)-llmisvc
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: readiness-timeout
          value: $(params.readiness_timeout)
      workspaces:
        - name: results
          workspace: results
    - name: smoke-test
      runAfter:
        - deploy
      taskRef:
        name: llm-d-e2e-smoke-test
      params:
        - name: model
          value: $(params.model)
        - name: service-name
          value: $(context.pipelineRun.name)-llmisvc
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: test-model
          value: $(params.test_model)
      workspaces:
        - name: results
          workspace: results
  finally:
    - name: cleanup
      taskRef:
        name: llm-d-e2e-cleanup
      params:
        - name: service-name
          value: $(context.pipelineRun.name)-llmisvc
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: deploy-status
          value: $(tasks.deploy.results.deployment-status)
        - name: test-status
          value: $(tasks.smoke-test.results.smoke-status)
      workspaces:
        - name: results
          workspace: results
