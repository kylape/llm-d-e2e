apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-maas-install-validate
spec:
  description: >-
    Install the MaaS test database, deploy the CPU simulator model and MaaS
    policy resources, and validate the resulting model catalog and readiness.
    Resources are intentionally retained after the PipelineRun.
  params:
    - name: simulator-image
      type: string
      default: ghcr.io/llm-d/llm-d-inference-sim@sha256:fced8f42b98b18b72d0cd452b5c1121edcef9849e73918e25536f795c94a2285
    - name: simulator-model
      type: string
      default: facebook/opt-125m
  workspaces:
    - name: guest-kubeconfig
  tasks:
    - name: install-database
      taskSpec:
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: install
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache bash ca-certificates curl openssl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              export KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl create namespace redhat-ai-gateway-infra \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -f - <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: postgres-creds
                namespace: redhat-ai-gateway-infra
              type: Opaque
              stringData:
                POSTGRES_USER: maas
                POSTGRES_PASSWORD: maas-e2e-test
                POSTGRES_DB: maas
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: postgres
                namespace: redhat-ai-gateway-infra
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: postgres
                template:
                  metadata:
                    labels:
                      app: postgres
                  spec:
                    containers:
                      - name: postgres
                        image: registry.redhat.io/rhel9/postgresql-16:latest
                        ports:
                          - containerPort: 5432
                        env:
                          - name: POSTGRESQL_USER
                            valueFrom:
                              secretKeyRef:
                                name: postgres-creds
                                key: POSTGRES_USER
                          - name: POSTGRESQL_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: postgres-creds
                                key: POSTGRES_PASSWORD
                          - name: POSTGRESQL_DATABASE
                            valueFrom:
                              secretKeyRef:
                                name: postgres-creds
                                key: POSTGRES_DB
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: postgres
                namespace: redhat-ai-gateway-infra
              spec:
                selector:
                  app: postgres
                ports:
                  - port: 5432
                    targetPort: 5432
              ---
              apiVersion: v1
              kind: Secret
              metadata:
                name: maas-db-config
                namespace: redhat-ai-gateway-infra
              type: Opaque
              stringData:
                DB_CONNECTION_URL: postgresql://maas:maas-e2e-test@postgres.redhat-ai-gateway-infra.svc.cluster.local:5432/maas?sslmode=disable
              EOF
              kubectl rollout status deployment/postgres \
                --namespace redhat-ai-gateway-infra --timeout=10m
              kubectl wait --for=create deployment/maas-api \
                --namespace redhat-ai-gateway-infra --timeout=10m
              kubectl rollout restart deployment/maas-api \
                --namespace redhat-ai-gateway-infra
              kubectl rollout status deployment/maas-api \
                --namespace redhat-ai-gateway-infra --timeout=10m
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: deploy-simulator-and-policies
      runAfter: [install-database]
      taskSpec:
        params:
          - name: simulator-image
            type: string
          - name: simulator-model
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: apply
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              export KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl create namespace llm --dry-run=client -o yaml | kubectl apply -f -
              kubectl create namespace models-as-a-service --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -f - <<EOF
              apiVersion: serving.kserve.io/v1alpha1
              kind: LLMInferenceService
              metadata:
                name: facebook-opt-125m-simulated
                namespace: llm
              spec:
                model:
                  uri: hf://placeholder/no-model
                  name: $(params.simulator-model)
                storageInitializer:
                  enabled: false
                replicas: 1
                router:
                  route: {}
                  gateway:
                    refs:
                      - name: maas-default-gateway
                        namespace: redhat-ods-applications
                template:
                  containers:
                    - name: main
                      image: $(params.simulator-image)
                      imagePullPolicy: IfNotPresent
                      command: ["/app/llm-d-inference-sim"]
                      args: ["--port", "8000", "--model", "$(params.simulator-model)", "--mode", "random", "--no-mm-encoder-only", "--ssl-certfile", "/var/run/kserve/tls/tls.crt", "--ssl-keyfile", "/var/run/kserve/tls/tls.key"]
                      ports:
                        - name: https
                          containerPort: 8000
                          protocol: TCP
                      readinessProbe:
                        httpGet:
                          path: /ready
                          port: https
                          scheme: HTTPS
                      livenessProbe:
                        httpGet:
                          path: /health
                          port: https
                          scheme: HTTPS
              ---
              apiVersion: maas.opendatahub.io/v1alpha1
              kind: MaaSModelRef
              metadata:
                name: facebook-opt-125m-simulated
                namespace: llm
              spec:
                modelRef:
                  kind: LLMInferenceService
                  name: facebook-opt-125m-simulated
              ---
              apiVersion: maas.opendatahub.io/v1alpha1
              kind: MaaSSubscription
              metadata:
                name: simulator-subscription
                namespace: models-as-a-service
              spec:
                owner:
                  groups:
                    - name: system:authenticated
                modelRefs:
                  - name: facebook-opt-125m-simulated
                    namespace: llm
                    tokenRateLimits:
                      - limit: 100
                        window: 1m
                priority: 10
              ---
              apiVersion: maas.opendatahub.io/v1alpha1
              kind: MaaSAuthPolicy
              metadata:
                name: simulator-access
                namespace: models-as-a-service
              spec:
                modelRefs:
                  - name: facebook-opt-125m-simulated
                    namespace: llm
                subjects:
                  groups:
                    - name: system:authenticated
                  users: []
              EOF
              kubectl wait --for=condition=Ready \
                llminferenceservice/facebook-opt-125m-simulated \
                --namespace llm --timeout=20m
      params:
        - name: simulator-image
          value: $(params.simulator-image)
        - name: simulator-model
          value: $(params.simulator-model)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: validate
      runAfter: [deploy-simulator-and-policies]
      taskSpec:
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: verify
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl jq
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              export KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl rollout status deployment/maas-controller \
                --namespace redhat-ods-applications --timeout=10m
              kubectl rollout status deployment/maas-api \
                --namespace redhat-ai-gateway-infra --timeout=10m
              kubectl wait --for=condition=Programmed \
                gateway/maas-default-gateway \
                --namespace redhat-ods-applications --timeout=10m
              kubectl wait --for=jsonpath='{.status.phase}'=Ready \
                maasmodelref/facebook-opt-125m-simulated \
                --namespace llm --timeout=10m
              test -n "$(kubectl get maasmodelref facebook-opt-125m-simulated \
                --namespace llm -o jsonpath='{.status.endpoint}')"
              kubectl get maasmodelref,maassubscription,maasauthpolicy \
                --all-namespaces
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig
