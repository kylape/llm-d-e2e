apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: llm-d-e2e-smoke-test
spec:
  params:
    - name: model
      type: string
    - name: service-name
      type: string
    - name: namespace
      type: string
  workspaces:
    - name: results
  results:
    - name: smoke-status
      description: PASS or TEST_FAILURE
  steps:
    - name: run-smoke
      image: quay.io/klape/llm-d-e2e@sha256:8dab87a75dc30104569844c50dde5a01ba741c395d79515dc4a361321d05d195
      env:
        - name: MODEL_URI
          value: $(params.model)
        - name: SERVICE_NAME
          value: $(params.service-name)
        - name: NAMESPACE
          value: $(params.namespace)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        report_dir="$(workspaces.results.path)/reports"
        mkdir -p "$report_dir"
        set +e
        llm-d-e2e \
          --profile configs/profiles/smoke.yaml \
          --mode discover \
          --namespace "$NAMESPACE" \
          --service-name "$SERVICE_NAME" \
          --model-uri "$MODEL_URI" \
          --nocleanup \
          --report-dir "$report_dir" \
          --junitxml "$report_dir/junit.xml"
        rc=$?
        set -e
        if [ "$rc" -eq 0 ]; then
          printf PASS > "$(results.smoke-status.path)"
          exit 0
        fi
        printf TEST_FAILURE > "$(results.smoke-status.path)"
        exit "$rc"
