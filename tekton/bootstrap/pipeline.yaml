apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-e2e-host-bootstrap
  namespace: llm-d-e2e-bootstrap
  labels:
    app.kubernetes.io/name: llm-d-e2e
    app.kubernetes.io/component: host-bootstrap
spec:
  description: >-
    Provision a vCluster on the host cluster, install RHAII in the guest,
    and publish a guest kubeconfig for the separate llm-d-e2e pipeline.
  params:
    - name: host-namespace
      type: string
      default: llm-d-vcluster
    - name: vcluster-name
      type: string
      default: llm-d-vcluster
    - name: vcluster-version
      type: string
      default: 0.36.1
    - name: etcd-image-repository
      type: string
      default: etcd
    - name: etcd-image-registry
      type: string
      default: registry.k8s.io
    - name: etcd-image-tag
      type: string
      default: 3.6.8-0
    - name: rhaii-git-repository
      type: string
      default: https://github.com/opendatahub-io/odh-gitops.git
    - name: rhaii-git-revision
      type: string
      default: af383937f4efd498a24f1128cde6a1779a70e69f
    - name: rhaii-namespace
      type: string
      default: redhat-ods-operator
    - name: rhaii-pull-secret-name
      type: string
      default: rhai-pull-secret
    - name: registry-auth-secret-name
      type: string
      default: rhai-pull-secret
    - name: registry-auth-secret-namespace
      type: string
      default: klape-llm-d-e2e
    - name: guest-namespace
      type: string
      default: klape-llm-d-e2e
    - name: kubeconfig-secret-name
      type: string
      default: llm-d-e2e-guest-kubeconfig
    - name: kubeconfig-secret-namespace
      type: string
      default: klape-llm-d-e2e
    - name: delete-vcluster
      type: string
      default: "false"
  workspaces:
    - name: guest-kubeconfig
      description: Generated kubeconfig for the vCluster guest.
  tasks:
    - name: create-vcluster
      taskSpec:
        params:
          - name: host-namespace
            type: string
          - name: vcluster-name
            type: string
          - name: vcluster-version
            type: string
          - name: etcd-image-repository
            type: string
          - name: etcd-image-registry
            type: string
          - name: etcd-image-tag
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: provision
            image: alpine/helm:3.19.0
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache bash ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              curl -fsSL \
                "https://github.com/loft-sh/vcluster/releases/download/v$(params.vcluster-version)/vcluster-linux-amd64" \
                -o /usr/local/bin/vcluster
              chmod +x /usr/local/bin/vcluster

              HOST_NS="$(params.host-namespace)"
              NAME="$(params.vcluster-name)"
              helm repo add loft https://charts.loft.sh
              helm repo update

              helm upgrade --install "$NAME" loft/vcluster \
                --namespace "$HOST_NS" --create-namespace \
                --version "$(params.vcluster-version)" \
                --set sync.fromHost.nodes.enabled=true \
                --set sync.toHost.pods.enabled=true \
                --set sync.toHost.gatewayApi.enabled=true \
                --set sync.toHost.gatewayApi.httpRoutes.enabled=true \
                --set sync.toHost.gatewayApi.gateways.enabled=true \
                --set controlPlane.distro.k8s.scheduler.enabled=false \
                --set controlPlane.service.spec.type=ClusterIP \
                --set controlPlane.backingStore.etcd.deploy.enabled=true \
                --set controlPlane.backingStore.etcd.deploy.statefulSet.enabled=true \
                --set controlPlane.backingStore.etcd.deploy.statefulSet.image.registry="$(params.etcd-image-registry)" \
                --set controlPlane.backingStore.etcd.deploy.statefulSet.image.repository="$(params.etcd-image-repository)" \
                --set controlPlane.backingStore.etcd.deploy.statefulSet.image.tag="$(params.etcd-image-tag)"

              kubectl wait --for=condition=Available \
                "deployment/${NAME}" --namespace "$HOST_NS" --timeout=10m
              vcluster connect "$NAME" --namespace "$HOST_NS" \
                --server "https://${NAME}.${HOST_NS}:443" \
                --print > "$(workspaces.guest-kubeconfig.path)/config"
              chmod 600 "$(workspaces.guest-kubeconfig.path)/config"
      params:
        - name: host-namespace
          value: $(params.host-namespace)
        - name: vcluster-name
          value: $(params.vcluster-name)
        - name: vcluster-version
          value: $(params.vcluster-version)
        - name: etcd-image-repository
          value: $(params.etcd-image-repository)
        - name: etcd-image-registry
          value: $(params.etcd-image-registry)
        - name: etcd-image-tag
          value: $(params.etcd-image-tag)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: configure-vcluster
      runAfter: [create-vcluster]
      taskSpec:
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: configure
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl --kubeconfig "$KUBECONFIG" wait --for=condition=Ready \
                node --all --timeout=10m
              kubectl --kubeconfig "$KUBECONFIG" -n kube-system wait \
                --for=condition=Available deployment/coredns --timeout=10m
              kubectl --kubeconfig "$KUBECONFIG" -n kube-system patch \
                deployment/coredns --type=merge \
                --patch '{"spec":{"template":{"spec":{"hostUsers":false}}}}'
              kubectl --kubeconfig "$KUBECONFIG" -n kube-system rollout status \
                deployment/coredns --timeout=10m
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: prepare-guest
      runAfter: [configure-vcluster]
      taskSpec:
        params:
          - name: guest-namespace
            type: string
          - name: pull-secret-name
            type: string
          - name: registry-auth-secret-name
            type: string
          - name: registry-auth-secret-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: namespace-and-secret
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl jq
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              kubectl get secret "$(params.registry-auth-secret-name)" \
                --namespace "$(params.registry-auth-secret-namespace)" \
                -o jsonpath='{.data.\.dockerconfigjson}' | \
                base64 -d > /tmp/rhai-pull-secret.json
              KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl --kubeconfig "$KUBECONFIG" create namespace \
                "$(params.guest-namespace)" --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
              kubectl --kubeconfig "$KUBECONFIG" -n "$(params.guest-namespace)" \
                create secret generic "$(params.pull-secret-name)" \
                --from-file=.dockerconfigjson=/tmp/rhai-pull-secret.json \
                --type=kubernetes.io/dockerconfigjson --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
      params:
        - name: guest-namespace
          value: $(params.guest-namespace)
        - name: pull-secret-name
          value: $(params.rhaii-pull-secret-name)
        - name: registry-auth-secret-name
          value: $(params.registry-auth-secret-name)
        - name: registry-auth-secret-namespace
          value: $(params.registry-auth-secret-namespace)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: install-rhaii
      runAfter: [prepare-guest]
      taskSpec:
        params:
          - name: rhaii-git-repository
            type: string
          - name: rhaii-git-revision
            type: string
          - name: rhaii-namespace
            type: string
          - name: registry-auth-secret-name
            type: string
          - name: registry-auth-secret-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: install
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              apk add --no-cache ca-certificates curl git jq
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              kubectl get secret "$(params.registry-auth-secret-name)" \
                --namespace "$(params.registry-auth-secret-namespace)" \
                -o jsonpath='{.data.\.dockerconfigjson}' | \
                base64 -d > /tmp/rhai-pull-secret.json
              AUTH=/tmp/rhai-pull-secret.json
              QUAY_AUTH="$(jq -r '(.auths["quay.io"] // .auths["https://quay.io"] // empty).auth // empty' "$AUTH")"
              if [ -n "$QUAY_AUTH" ]; then
                QUAY_CREDENTIALS="$(printf '%s' "$QUAY_AUTH" | base64 -d)"
                QUAY_USERNAME="${QUAY_CREDENTIALS%%:*}"
                QUAY_PASSWORD="${QUAY_CREDENTIALS#*:}"
              else
                QUAY_USERNAME="$(jq -r '(.auths["quay.io"] // .auths["https://quay.io"] // empty).username // empty' "$AUTH")"
                QUAY_PASSWORD="$(jq -r '(.auths["quay.io"] // .auths["https://quay.io"] // empty).password // empty' "$AUTH")"
              fi
              test -n "$QUAY_USERNAME"
              test -n "$QUAY_PASSWORD"
              max_attempts=6
              attempt=1
              while ! printf '%s' "$QUAY_PASSWORD" | helm registry login quay.io \
                  --username "$QUAY_USERNAME" --password-stdin \
                  --registry-config "$AUTH"; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Quay authentication failed after ${max_attempts} attempts" >&2
                  exit 1
                fi
                delay=$((attempt * 15))
                echo "Quay authentication failed; retrying in ${delay}s (${attempt}/${max_attempts})" >&2
                sleep "$delay"
                attempt=$((attempt + 1))
              done
              export HELM_REGISTRY_CONFIG="$AUTH"
              git clone --no-checkout "$(params.rhaii-git-repository)" /tmp/odh-gitops
              git -C /tmp/odh-gitops checkout --detach "$(params.rhaii-git-revision)"
              helm dependency build /tmp/odh-gitops/charts/rhai-on-xks-chart
              kubectl --kubeconfig "$KUBECONFIG" create namespace \
                "$(params.rhaii-namespace)" --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
              cat > /tmp/rhaii-values.yaml <<'EOF'
              azure:
                enabled: false
              coreweave:
                enabled: true
              components:
                kserve:
                  gateway:
                    allowedRoutes:
                      namespaces:
                        from: Same
              EOF
              helm upgrade --install rhaii /tmp/odh-gitops/charts/rhai-on-xks-chart \
                --namespace "$(params.rhaii-namespace)" \
                --take-ownership \
                --kubeconfig "$KUBECONFIG" --values /tmp/rhaii-values.yaml \
                --set-file imagePullSecret.dockerConfigJson="$AUTH" \
                --no-hooks --timeout=30m

              kubectl --kubeconfig "$KUBECONFIG" -n rhai-cloudmanager-system wait \
                --for=condition=Available deployment/coreweave-cloud-manager-operator \
                --timeout=10m

              # Apply the provider CR explicitly. This triggers the CoreWeave
              # cloud-manager cert-manager bootstrap before the remaining Helm
              # post-upgrade hooks run. The current values leave its spec empty,
              # matching the chart hook's effective configuration.
              kubectl --kubeconfig "$KUBECONFIG" apply -f - <<'EOF'
              apiVersion: infrastructure.opendatahub.io/v1alpha1
              kind: CoreWeaveKubernetesEngine
              metadata:
                name: default-coreweavekubernetesengine
              spec: {}
              EOF

              helm upgrade --install rhaii /tmp/odh-gitops/charts/rhai-on-xks-chart \
                --namespace "$(params.rhaii-namespace)" \
                --take-ownership \
                --kubeconfig "$KUBECONFIG" --values /tmp/rhaii-values.yaml \
                --set-file imagePullSecret.dockerConfigJson="$AUTH" \
                --timeout=30m
      params:
        - name: rhaii-git-repository
          value: $(params.rhaii-git-repository)
        - name: rhaii-git-revision
          value: $(params.rhaii-git-revision)
        - name: rhaii-namespace
          value: $(params.rhaii-namespace)
        - name: registry-auth-secret-name
          value: $(params.registry-auth-secret-name)
        - name: registry-auth-secret-namespace
          value: $(params.registry-auth-secret-namespace)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: publish-kubeconfig
      runAfter: [configure-vcluster]
      taskSpec:
        params:
          - name: secret-name
            type: string
          - name: secret-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: publish
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              kubectl create secret generic "$(params.secret-name)" \
                --namespace "$(params.secret-namespace)" --from-file=config="$(workspaces.guest-kubeconfig.path)/config" \
                --type=Opaque --dry-run=client -o yaml | kubectl apply -f -
      params:
        - name: secret-name
          value: $(params.kubeconfig-secret-name)
        - name: secret-namespace
          value: $(params.kubeconfig-secret-namespace)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig
  finally:
    - name: destroy-vcluster
      taskSpec:
        params:
          - name: host-namespace
            type: string
          - name: vcluster-name
            type: string
          - name: delete-vcluster
            type: string
          - name: kubeconfig-secret-name
            type: string
          - name: kubeconfig-secret-namespace
            type: string
        steps:
          - name: destroy
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              if [ "$(params.delete-vcluster)" != "true" ]; then
                echo "delete-vcluster is false; retaining the host resources"
                exit 0
              fi
              helm uninstall "$(params.vcluster-name)" \
                --namespace "$(params.host-namespace)" || true
              kubectl delete secret "$(params.kubeconfig-secret-name)" \
                --namespace "$(params.kubeconfig-secret-namespace)" \
                --ignore-not-found
      params:
        - name: host-namespace
          value: $(params.host-namespace)
        - name: vcluster-name
          value: $(params.vcluster-name)
        - name: delete-vcluster
          value: $(params.delete-vcluster)
        - name: kubeconfig-secret-name
          value: $(params.kubeconfig-secret-name)
        - name: kubeconfig-secret-namespace
          value: $(params.kubeconfig-secret-namespace)
