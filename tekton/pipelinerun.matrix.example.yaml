apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: llm-d-e2e-burrito-matrix-
  namespace: klape-llm-d-e2e
spec:
  pipelineRef:
    name: llm-d-e2e-burrito-matrix
  params:
    - name: runner_image
      value: quay.io/klape/llm-d-e2e@sha256:<digest>
    - name: queue
      value: klape-llm-d-e2e
    - name: pull_secret_name
      value: rhai-pull-secret
    - name: pull_secret_source_namespace
      value: klape-llm-d-e2e
  taskRunTemplate:
    serviceAccountName: llm-d-e2e-runner
