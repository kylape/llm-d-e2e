apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: llm-d-e2e-inference-workspace-
  namespace: klape-dev
spec:
  taskRunTemplate:
    serviceAccountName: pipeline
  pipelineRef:
    name: llm-d-e2e-host-bootstrap
  params:
    - name: create-inference-workspace
      value: "true"
    - name: inference-workspace-name
      value: maas-test
    - name: inference-workspace-namespace
      value: klape-dev
    - name: inference-workspace-cluster-queue
      value: inference-workspace-test
    - name: registry-auth-secret-name
      value: rhai-pull-secret
    - name: registry-auth-secret-namespace
      value: klape-dev
    - name: guest-namespace
      value: llm-d-e2e
  workspaces:
    - name: guest-kubeconfig
      emptyDir: {}
