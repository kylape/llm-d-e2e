apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-d-e2e-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-d-e2e-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: llm-d-e2e-bootstrap
    namespace: klape-llm-d-e2e

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-d-e2e-inference-workspace
rules:
  - apiGroups: [inference.redhat.com]
    resources: [inferenceworkspaces]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-d-e2e-inference-workspace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-d-e2e-inference-workspace
subjects:
  - kind: ServiceAccount
    name: llm-d-e2e-bootstrap
  - kind: ServiceAccount
    name: pipeline
