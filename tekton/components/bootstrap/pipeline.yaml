apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-e2e-host-bootstrap
  labels:
    app.kubernetes.io/name: llm-d-e2e
    app.kubernetes.io/component: host-bootstrap
spec:
  description: >-
    Provision a vCluster on the host cluster, prepare the MaaS database,
    install RHAII in the guest, and publish a guest kubeconfig for the separate
    llm-d-e2e and MaaS pipelines.
  params:
    - name: host-namespace
      type: string
      default: llm-d-vcluster
    - name: vcluster-name
      type: string
      default: llm-d-vcluster
    - name: vcluster-version
      type: string
      default: 0.36.1
    - name: etcd-image-repository
      type: string
      default: etcd
    - name: etcd-image-registry
      type: string
      default: registry.k8s.io
    - name: etcd-image-tag
      type: string
      default: 3.6.8-0
    - name: rhaii-git-repository
      type: string
      default: https://github.com/opendatahub-io/odh-gitops.git
    - name: rhaii-git-revision
      type: string
      default: af383937f4efd498a24f1128cde6a1779a70e69f
    - name: rhaii-namespace
      type: string
      default: redhat-ods-operator
    - name: rhaii-gateway-namespace
      type: string
      default: redhat-ods-applications
    - name: rhaii-pull-secret-name
      type: string
      default: rhai-pull-secret
    - name: registry-auth-secret-name
      type: string
      default: rhai-pull-secret
    - name: registry-auth-secret-namespace
      type: string
      default: klape-llm-d-e2e
    - name: guest-namespace
      type: string
      default: klape-llm-d-e2e
    - name: kubeconfig-secret-name
      type: string
      default: llm-d-e2e-guest-kubeconfig
    - name: kubeconfig-secret-namespace
      type: string
      default: klape-llm-d-e2e
    - name: delete-vcluster
      type: string
      default: "false"
  workspaces:
    - name: guest-kubeconfig
      description: Generated kubeconfig for the vCluster guest.
  tasks:
    - name: create-vcluster
      taskSpec:
        params:
          - name: host-namespace
            type: string
          - name: vcluster-name
            type: string
          - name: vcluster-version
            type: string
          - name: etcd-image-repository
            type: string
          - name: etcd-image-registry
            type: string
          - name: etcd-image-tag
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: provision
            image: alpine/helm:3.19.0
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache bash ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              curl -fsSL \
                "https://github.com/loft-sh/vcluster/releases/download/v$(params.vcluster-version)/vcluster-linux-amd64" \
                -o /usr/local/bin/vcluster
              chmod +x /usr/local/bin/vcluster

              HOST_NS="$(params.host-namespace)"
              NAME="$(params.vcluster-name)"
              helm repo add loft https://charts.loft.sh
              helm repo update

              helm upgrade --install "$NAME" loft/vcluster \
                --namespace "$HOST_NS" --create-namespace \
                --version "$(params.vcluster-version)" \
                --set sync.fromHost.nodes.enabled=true \
                --set sync.toHost.pods.enabled=true \
                --set sync.toHost.gatewayApi.enabled=true \
                --set sync.toHost.gatewayApi.httpRoutes.enabled=true \
                --set sync.toHost.gatewayApi.gateways.enabled=true \
                --set controlPlane.distro.k8s.scheduler.enabled=false \
                --set controlPlane.service.spec.type=ClusterIP \
                --set controlPlane.backingStore.etcd.deploy.enabled=true \
                --set controlPlane.backingStore.etcd.deploy.statefulSet.enabled=true \
                --set controlPlane.backingStore.etcd.deploy.statefulSet.image.registry="$(params.etcd-image-registry)" \
                --set controlPlane.backingStore.etcd.deploy.statefulSet.image.repository="$(params.etcd-image-repository)" \
                --set controlPlane.backingStore.etcd.deploy.statefulSet.image.tag="$(params.etcd-image-tag)"

              kubectl wait --for=condition=Available \
                "deployment/${NAME}" --namespace "$HOST_NS" --timeout=10m
              vcluster connect "$NAME" --namespace "$HOST_NS" \
                --server "https://${NAME}.${HOST_NS}:443" \
                --print > "$(workspaces.guest-kubeconfig.path)/config"
              chmod 600 "$(workspaces.guest-kubeconfig.path)/config"
      params:
        - name: host-namespace
          value: $(params.host-namespace)
        - name: vcluster-name
          value: $(params.vcluster-name)
        - name: vcluster-version
          value: $(params.vcluster-version)
        - name: etcd-image-repository
          value: $(params.etcd-image-repository)
        - name: etcd-image-registry
          value: $(params.etcd-image-registry)
        - name: etcd-image-tag
          value: $(params.etcd-image-tag)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: configure-vcluster
      runAfter: [create-vcluster]
      taskSpec:
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: configure
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl --kubeconfig "$KUBECONFIG" wait --for=condition=Ready \
                node --all --timeout=10m
              kubectl --kubeconfig "$KUBECONFIG" -n kube-system wait \
                --for=condition=Available deployment/coredns --timeout=10m
              kubectl --kubeconfig "$KUBECONFIG" -n kube-system patch \
                deployment/coredns --type=merge \
                --patch '{"spec":{"template":{"spec":{"hostUsers":false}}}}'
              kubectl --kubeconfig "$KUBECONFIG" -n kube-system rollout status \
                deployment/coredns --timeout=10m
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: prepare-guest
      runAfter: [configure-vcluster]
      taskSpec:
        params:
          - name: guest-namespace
            type: string
          - name: pull-secret-name
            type: string
          - name: registry-auth-secret-name
            type: string
          - name: registry-auth-secret-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: namespace-and-secret
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl jq
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              kubectl get secret "$(params.registry-auth-secret-name)" \
                --namespace "$(params.registry-auth-secret-namespace)" \
                -o jsonpath='{.data.\.dockerconfigjson}' | \
                base64 -d > /tmp/rhai-pull-secret.json
              KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl --kubeconfig "$KUBECONFIG" create namespace \
                "$(params.guest-namespace)" --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
              kubectl --kubeconfig "$KUBECONFIG" -n "$(params.guest-namespace)" \
                create secret generic "$(params.pull-secret-name)" \
                --from-file=.dockerconfigjson=/tmp/rhai-pull-secret.json \
                --type=kubernetes.io/dockerconfigjson --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
      params:
        - name: guest-namespace
          value: $(params.guest-namespace)
        - name: pull-secret-name
          value: $(params.rhaii-pull-secret-name)
        - name: registry-auth-secret-name
          value: $(params.registry-auth-secret-name)
        - name: registry-auth-secret-namespace
          value: $(params.registry-auth-secret-namespace)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: prepare-infra-pull-secret
      runAfter: [prepare-guest]
      taskSpec:
        params:
          - name: pull-secret-name
            type: string
          - name: registry-auth-secret-name
            type: string
          - name: registry-auth-secret-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: prepare
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              kubectl get secret "$(params.registry-auth-secret-name)" \
                --namespace "$(params.registry-auth-secret-namespace)" \
                -o jsonpath='{.data.\.dockerconfigjson}' | \
                base64 -d > /tmp/rhai-pull-secret.json
              KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl --kubeconfig "$KUBECONFIG" create namespace \
                redhat-ai-gateway-infra --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
              kubectl --kubeconfig "$KUBECONFIG" -n redhat-ai-gateway-infra \
                create secret generic "$(params.pull-secret-name)" \
                --from-file=.dockerconfigjson=/tmp/rhai-pull-secret.json \
                --type=kubernetes.io/dockerconfigjson --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
      params:
        - name: pull-secret-name
          value: $(params.rhaii-pull-secret-name)
        - name: registry-auth-secret-name
          value: $(params.registry-auth-secret-name)
        - name: registry-auth-secret-namespace
          value: $(params.registry-auth-secret-namespace)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: install-database
      runAfter: [prepare-infra-pull-secret]
      taskSpec:
        params:
          - name: pull-secret-name
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: install
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              export KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              maas_api_preexisting=false
              if kubectl get deployment/maas-api \
                --namespace redhat-ai-gateway-infra >/dev/null 2>&1; then
                maas_api_preexisting=true
              fi
              kubectl create namespace redhat-ai-gateway-infra \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -f - <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: postgres-creds
                namespace: redhat-ai-gateway-infra
              type: Opaque
              stringData:
                POSTGRES_USER: maas
                POSTGRES_PASSWORD: maas-e2e-test
                POSTGRES_DB: maas
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: postgres
                namespace: redhat-ai-gateway-infra
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: postgres
                template:
                  metadata:
                    labels:
                      app: postgres
                  spec:
                    imagePullSecrets:
                      - name: $(params.pull-secret-name)
                    containers:
                      - name: postgres
                        image: registry.redhat.io/rhel9/postgresql-16:latest
                        ports:
                          - containerPort: 5432
                        env:
                          - name: POSTGRESQL_USER
                            valueFrom:
                              secretKeyRef:
                                name: postgres-creds
                                key: POSTGRES_USER
                          - name: POSTGRESQL_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: postgres-creds
                                key: POSTGRES_PASSWORD
                          - name: POSTGRESQL_DATABASE
                            valueFrom:
                              secretKeyRef:
                                name: postgres-creds
                                key: POSTGRES_DB
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: postgres
                namespace: redhat-ai-gateway-infra
              spec:
                selector:
                  app: postgres
                ports:
                  - port: 5432
                    targetPort: 5432
              ---
              apiVersion: v1
              kind: Secret
              metadata:
                name: maas-db-config
                namespace: redhat-ai-gateway-infra
              type: Opaque
              stringData:
                DB_CONNECTION_URL: postgresql://maas:maas-e2e-test@postgres.redhat-ai-gateway-infra.svc.cluster.local:5432/maas?sslmode=disable
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: maas-api-db-secret-reader
                namespace: redhat-ai-gateway-infra
              rules:
                - apiGroups: [""]
                  resources: [secrets]
                  resourceNames: [maas-db-config]
                  verbs: [get]
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: maas-api-db-secret-reader
                namespace: redhat-ai-gateway-infra
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: maas-api-db-secret-reader
              subjects:
                - kind: ServiceAccount
                  name: maas-api
                  namespace: redhat-ai-gateway-infra
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: maas-api-runtime-reader
              rules:
                - apiGroups: [""]
                  resources: [namespaces, serviceaccounts, services]
                  verbs: [get, list, watch]
                - apiGroups: [authentication.k8s.io]
                  resources: [tokenreviews]
                  verbs: [create]
                - apiGroups: [authorization.k8s.io]
                  resources: [subjectaccessreviews]
                  verbs: [create]
                - apiGroups: [maas.opendatahub.io]
                  resources: [maasauthpolicies, maasmodelrefs, maassubscriptions]
                  verbs: [get, list, watch]
                - apiGroups: [gateway.networking.k8s.io]
                  resources: [gateways]
                  verbs: [get]
                - apiGroups: [config.openshift.io]
                  resources: [apiservers]
                  verbs: [get, list, watch]
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: maas-api-runtime-reader
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: maas-api-runtime-reader
              subjects:
                - kind: ServiceAccount
                  name: maas-api
                  namespace: redhat-ai-gateway-infra
              EOF
              kubectl rollout status deployment/postgres \
                --namespace redhat-ai-gateway-infra --timeout=10m
              if [ "$maas_api_preexisting" = true ]; then
                kubectl rollout restart deployment/maas-api \
                  --namespace redhat-ai-gateway-infra
                kubectl rollout status deployment/maas-api \
                  --namespace redhat-ai-gateway-infra --timeout=10m
              else
                echo "maas-api was not present before database setup; no restart needed"
              fi
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig
      params:
        - name: pull-secret-name
          value: $(params.rhaii-pull-secret-name)

    - name: install-rhaii
      runAfter: [prepare-infra-pull-secret]
      taskSpec:
        params:
          - name: rhaii-git-repository
            type: string
          - name: rhaii-git-revision
            type: string
          - name: rhaii-namespace
            type: string
          - name: rhaii-gateway-namespace
            type: string
          - name: registry-auth-secret-name
            type: string
          - name: registry-auth-secret-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: install
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              apk add --no-cache ca-certificates curl git jq
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              kubectl get secret "$(params.registry-auth-secret-name)" \
                --namespace "$(params.registry-auth-secret-namespace)" \
                -o jsonpath='{.data.\.dockerconfigjson}' | \
                base64 -d > /tmp/rhai-pull-secret.json
              AUTH=/tmp/rhai-pull-secret.json
              QUAY_AUTH="$(jq -r '(.auths["quay.io"] // .auths["https://quay.io"] // empty).auth // empty' "$AUTH")"
              if [ -n "$QUAY_AUTH" ]; then
                QUAY_CREDENTIALS="$(printf '%s' "$QUAY_AUTH" | base64 -d)"
                QUAY_USERNAME="${QUAY_CREDENTIALS%%:*}"
                QUAY_PASSWORD="${QUAY_CREDENTIALS#*:}"
              else
                QUAY_USERNAME="$(jq -r '(.auths["quay.io"] // .auths["https://quay.io"] // empty).username // empty' "$AUTH")"
                QUAY_PASSWORD="$(jq -r '(.auths["quay.io"] // .auths["https://quay.io"] // empty).password // empty' "$AUTH")"
              fi
              test -n "$QUAY_USERNAME"
              test -n "$QUAY_PASSWORD"
              max_attempts=6
              attempt=1
              while ! printf '%s' "$QUAY_PASSWORD" | helm registry login quay.io \
                  --username "$QUAY_USERNAME" --password-stdin \
                  --registry-config "$AUTH"; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Quay authentication failed after ${max_attempts} attempts" >&2
                  exit 1
                fi
                delay=$((attempt * 15))
                echo "Quay authentication failed; retrying in ${delay}s (${attempt}/${max_attempts})" >&2
                sleep "$delay"
                attempt=$((attempt + 1))
              done
              export HELM_REGISTRY_CONFIG="$AUTH"
              git clone --no-checkout "$(params.rhaii-git-repository)" /tmp/odh-gitops
              git -C /tmp/odh-gitops checkout --detach "$(params.rhaii-git-revision)"
              helm dependency build /tmp/odh-gitops/charts/rhai-on-xks-chart
              kubectl --kubeconfig "$KUBECONFIG" create namespace \
                redhat-ai-gateway-infra --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
              kubectl --kubeconfig "$KUBECONFIG" create namespace \
                kuadrant-system --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -
              kubectl --kubeconfig "$KUBECONFIG" create namespace \
                "$(params.rhaii-namespace)" --dry-run=client -o yaml | \
                kubectl --kubeconfig "$KUBECONFIG" apply -f -

              # Install Kuadrant before RHAII. The operator and its operands
              # are installed by Helm; readiness is checked below before the
              # second RHAII Helm pass.
              helm repo add kuadrant https://kuadrant.io/helm-charts/ --force-update
              helm upgrade --install kuadrant-operator kuadrant/kuadrant-operator \
                --namespace kuadrant-system --create-namespace \
                --version 1.5.2 --kubeconfig "$KUBECONFIG"
              cat > /tmp/rhaii-values.yaml <<'EOF'
              hooks:
                postInstallCrs:
                  enabled: false
              azure:
                enabled: false
              coreweave:
                enabled: true
              components:
                kserve:
                  gateway:
                    allowedRoutes:
                      namespaces:
                        from: Same
                aigateway:
                  enabled: true
                  spec:
                    modelsAsAService:
                      managementState: Managed
                  modelsAsAService:
                    gateway:
                      create: true
                      gatewayClassName: istio
                      allowedRoutes:
                        namespaces:
                          from: All
              EOF
              kubectl --kubeconfig "$KUBECONFIG" wait --for=create \
                deployment/postgres --namespace redhat-ai-gateway-infra \
                --timeout=10m
              kubectl --kubeconfig "$KUBECONFIG" wait \
                --for=condition=Available deployment/postgres \
                --namespace redhat-ai-gateway-infra --timeout=10m
              max_helm_attempts=3
              helm_attempt=1
              while :; do
                if helm upgrade --install rhaii /tmp/odh-gitops/charts/rhai-on-xks-chart \
                    --namespace "$(params.rhaii-namespace)" \
                    --take-ownership \
                    --kubeconfig "$KUBECONFIG" --values /tmp/rhaii-values.yaml \
                    --set-file imagePullSecret.dockerConfigJson="$AUTH" \
                    --no-hooks --timeout=30m; then
                  break
                fi
                if [ "$helm_attempt" -ge "$max_helm_attempts" ]; then
                  echo "Initial RHAII Helm install failed after ${max_helm_attempts} attempts" >&2
                  exit 1
                fi
                delay=$((helm_attempt * 15))
                echo "Initial RHAII Helm install failed; retrying in ${delay}s (${helm_attempt}/${max_helm_attempts})" >&2
                sleep "$delay"
                helm_attempt=$((helm_attempt + 1))
              done

              kubectl --kubeconfig "$KUBECONFIG" -n rhai-cloudmanager-system wait \
                --for=condition=Available deployment/coreweave-cloud-manager-operator \
                --timeout=10m

              wait_for_crd() {
                local crd="$1"
                local elapsed=0
                while ! kubectl --kubeconfig "$KUBECONFIG" get "crd/${crd}" \
                    >/dev/null 2>&1; do
                  if [ "$elapsed" -ge 300 ]; then
                    echo "Timed out waiting for CRD ${crd} to be created" >&2
                    exit 1
                  fi
                  sleep 5
                  elapsed=$((elapsed + 5))
                done
                kubectl --kubeconfig "$KUBECONFIG" wait \
                  --for=condition=established --timeout=300s \
                  "crd/${crd}"
              }

              kubectl --kubeconfig "$KUBECONFIG" wait \
                --for=condition=Available \
                deployment/kuadrant-operator-controller-manager \
                --namespace kuadrant-system --timeout=10m
              wait_for_crd kuadrants.kuadrant.io
              kubectl --kubeconfig "$KUBECONFIG" apply -f - <<'EOF'
              apiVersion: kuadrant.io/v1beta1
              kind: Kuadrant
              metadata:
                name: kuadrant
                namespace: kuadrant-system
              EOF
              kubectl --kubeconfig "$KUBECONFIG" apply -f \
                'https://raw.githubusercontent.com/Kuadrant/kuadrant-operator/v1.5.2/config/install/configure/standard/limitador.yaml'
              kubectl --kubeconfig "$KUBECONFIG" apply -f \
                'https://raw.githubusercontent.com/Kuadrant/kuadrant-operator/v1.5.2/config/install/configure/standard/authorino.yaml'
              kubectl --kubeconfig "$KUBECONFIG" apply -f \
                'https://raw.githubusercontent.com/Kuadrant/kuadrant-operator/v1.5.2/config/install/configure/standard/kuadrant.yaml'
              wait_for_crd authconfigs.authorino.kuadrant.io
              kubectl --kubeconfig "$KUBECONFIG" wait \
                --for=condition=Available \
                deployment/authorino-operator --namespace kuadrant-system \
                --timeout=10m
              kubectl --kubeconfig "$KUBECONFIG" wait \
                --for=condition=Available deployment/authorino \
                --namespace kuadrant-system --timeout=10m

              # Apply the CRs from the chart's postInstallCrs hook explicitly.
              # The KServe CR must be created before the AIGateway CRD can be
              # registered; doing this here avoids the hook's circular wait.
              kubectl --kubeconfig "$KUBECONFIG" apply -f - <<'EOF'
              apiVersion: infrastructure.opendatahub.io/v1alpha1
              kind: CoreWeaveKubernetesEngine
              metadata:
                name: default-coreweavekubernetesengine
              spec:
                dependencies:
                  certManager:
                    managementPolicy: Unmanaged
                    configuration: {}
                  gatewayAPI:
                    managementPolicy: Managed
                    configuration: {}
                  lws:
                    managementPolicy: Unmanaged
                    configuration:
                      namespace: openshift-lws-operator
                  sailOperator:
                    managementPolicy: Managed
                    configuration:
                      namespace: istio-system
              EOF

              # The CoreWeave cloud manager installs Sail Operator from the
              # dependency declaration above. Wait for its CRD before the
              # final RHAII Helm pass creates gateway resources.
              wait_for_crd istios.sailoperator.io

              wait_for_crd platforms.config.opendatahub.io
              kubectl --kubeconfig "$KUBECONFIG" apply -f - <<'EOF'
              apiVersion: config.opendatahub.io/v1alpha1
              kind: Platform
              metadata:
                name: default
              spec:
                modules:
                  aigateway:
                    managementState: Managed
                  kserve:
                    managementState: Managed
              EOF

              wait_for_crd kserves.components.platform.opendatahub.io
              kubectl --kubeconfig "$KUBECONFIG" apply -f - <<'EOF'
              apiVersion: components.platform.opendatahub.io/v1alpha1
              kind: Kserve
              metadata:
                name: default-kserve
              spec: {}
              EOF

              wait_for_crd aigateways.components.platform.opendatahub.io
              kubectl --kubeconfig "$KUBECONFIG" apply -f - <<'EOF'
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: ai-gateway-rbac-escalation
              rules:
                # The xKS bundle generates several subordinate Roles and
                # ClusterRoles. These verbs explicitly authorize RBAC
                # escalation and binding without enumerating their contents.
                - apiGroups: [rbac.authorization.k8s.io]
                  resources: [roles, clusterroles]
                  verbs: [bind, escalate]
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: ai-gateway-rbac-escalation
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: ai-gateway-rbac-escalation
              subjects:
                - kind: ServiceAccount
                  name: ai-gateway-operator
                  namespace: redhat-ods-applications
              EOF

              kubectl --kubeconfig "$KUBECONFIG" apply -f - <<'EOF'
              apiVersion: components.platform.opendatahub.io/v1alpha1
              kind: AIGateway
              metadata:
                name: default-aigateway
              spec:
                modelsAsAService:
                  managementState: Managed
              EOF

              kubectl --kubeconfig "$KUBECONFIG" apply -f - <<'EOF'
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: rhai-post-install-hook
                namespace: redhat-ods-operator
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: rhai-post-install-hook
              rules:
                - apiGroups: [components.platform.opendatahub.io]
                  resources: [aigateways, kserves]
                  verbs: [get, create, patch, update]
                - apiGroups: [apiextensions.k8s.io]
                  resources: [customresourcedefinitions]
                  verbs: [get, list, watch]
                - apiGroups: [infrastructure.opendatahub.io]
                  resources: [coreweavekubernetesengines]
                  verbs: [get, create, patch, update]
                - apiGroups: [gateway.networking.k8s.io]
                  resources: [gateways]
                  verbs: [get, create, patch, update]
                - apiGroups: [gateway.networking.k8s.io]
                  resources: [gatewayclasses]
                  verbs: [get]
                - apiGroups: [""]
                  resources: [secrets]
                  verbs: [get]
                - apiGroups: [""]
                  resources: [configmaps]
                  verbs: [get, create, patch, update]
                - apiGroups: [cert-manager.io]
                  resources: [clusterissuers, certificates]
                  verbs: [get, create, patch, update]
                - apiGroups: [""]
                  resources: [namespaces]
                  resourceNames: [redhat-ods-applications, kuadrant-system]
                  verbs: [get, create, patch]
                - apiGroups: [apps]
                  resources: [deployments]
                  resourceNames: [authorino]
                  verbs: [get, patch]
                - apiGroups: [config.opendatahub.io]
                  resources: [platforms]
                  verbs: [get, create, patch, update]
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: rhai-post-install-hook
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: rhai-post-install-hook
              subjects:
                - kind: ServiceAccount
                  name: rhai-post-install-hook
                  namespace: redhat-ods-operator
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: rhai-post-install-hook-cert
                namespace: redhat-ods-applications
              rules:
                - apiGroups: [cert-manager.io]
                  resources: [certificates]
                  verbs: [get, create, patch, update]
                - apiGroups: [""]
                  resources: [secrets]
                  verbs: [get, create, patch, update]
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: rhai-post-install-hook-cert
                namespace: redhat-ods-applications
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: rhai-post-install-hook-cert
              subjects:
                - kind: ServiceAccount
                  name: rhai-post-install-hook
                  namespace: redhat-ods-operator
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: rhai-post-install-hook-kuadrant
                namespace: kuadrant-system
              rules:
                - apiGroups: [""]
                  resources: [configmaps]
                  verbs: [get, create, patch, update]
                - apiGroups: [cert-manager.io]
                  resources: [certificates]
                  verbs: [get, create, patch, update]
                - apiGroups: [operator.authorino.kuadrant.io]
                  resources: [authorinos]
                  resourceNames: [authorino]
                  verbs: [get, patch, update]
                - apiGroups: [apps]
                  resources: [deployments]
                  resourceNames: [authorino]
                  verbs: [get, patch]
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: rhai-post-install-hook-kuadrant
                namespace: kuadrant-system
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: rhai-post-install-hook-kuadrant
              subjects:
                - kind: ServiceAccount
                  name: rhai-post-install-hook
                  namespace: redhat-ods-operator
              EOF

              helm upgrade --install rhaii /tmp/odh-gitops/charts/rhai-on-xks-chart \
                --namespace "$(params.rhaii-namespace)" \
                --take-ownership \
                --kubeconfig "$KUBECONFIG" --values /tmp/rhaii-values.yaml \
                --set-file imagePullSecret.dockerConfigJson="$AUTH" \
                --timeout=30m

              # The chart currently creates the Gateway with Same-namespace
              # route admission. The e2e namespace is separate, so allow
              # HTTPRoutes from any guest namespace after the chart hooks run.
              kubectl --kubeconfig "$KUBECONFIG" patch gateway inference-gateway \
                --namespace "$(params.rhaii-gateway-namespace)" \
                --type=json \
                --patch='[{"op":"replace","path":"/spec/listeners/0/allowedRoutes/namespaces/from","value":"All"},{"op":"replace","path":"/spec/listeners/1/allowedRoutes/namespaces/from","value":"All"}]'
      params:
        - name: rhaii-git-repository
          value: $(params.rhaii-git-repository)
        - name: rhaii-git-revision
          value: $(params.rhaii-git-revision)
        - name: rhaii-namespace
          value: $(params.rhaii-namespace)
        - name: rhaii-gateway-namespace
          value: $(params.rhaii-gateway-namespace)
        - name: registry-auth-secret-name
          value: $(params.registry-auth-secret-name)
        - name: registry-auth-secret-namespace
          value: $(params.registry-auth-secret-namespace)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig

    - name: publish-kubeconfig
      runAfter: [configure-vcluster]
      taskSpec:
        params:
          - name: secret-name
            type: string
          - name: secret-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: publish
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              kubectl create secret generic "$(params.secret-name)" \
                --namespace "$(params.secret-namespace)" --from-file=config="$(workspaces.guest-kubeconfig.path)/config" \
                --type=Opaque --dry-run=client -o yaml | kubectl apply -f -
      params:
        - name: secret-name
          value: $(params.kubeconfig-secret-name)
        - name: secret-namespace
          value: $(params.kubeconfig-secret-namespace)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig
  finally:
    - name: destroy-vcluster
      taskSpec:
        params:
          - name: host-namespace
            type: string
          - name: vcluster-name
            type: string
          - name: delete-vcluster
            type: string
          - name: kubeconfig-secret-name
            type: string
          - name: kubeconfig-secret-namespace
            type: string
        steps:
          - name: destroy
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              if [ "$(params.delete-vcluster)" != "true" ]; then
                echo "delete-vcluster is false; retaining the host resources"
                exit 0
              fi
              helm uninstall "$(params.vcluster-name)" \
                --namespace "$(params.host-namespace)" || true
              kubectl delete secret "$(params.kubeconfig-secret-name)" \
                --namespace "$(params.kubeconfig-secret-namespace)" \
                --ignore-not-found
      params:
        - name: host-namespace
          value: $(params.host-namespace)
        - name: vcluster-name
          value: $(params.vcluster-name)
        - name: delete-vcluster
          value: $(params.delete-vcluster)
        - name: kubeconfig-secret-name
          value: $(params.kubeconfig-secret-name)
        - name: kubeconfig-secret-namespace
          value: $(params.kubeconfig-secret-namespace)
