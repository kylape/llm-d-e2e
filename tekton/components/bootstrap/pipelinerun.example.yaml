apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: llm-d-e2e-host-bootstrap-
spec:
  pipelineRef:
    name: llm-d-e2e-host-bootstrap
  taskRunTemplate:
    serviceAccountName: llm-d-e2e-bootstrap
  params:
    - name: vcluster-name
      value: vcluster-test
    - name: host-namespace
      value: vcluster-test
    - name: vcluster-version
      value: 0.36.1
    - name: vcluster-chart-version
      value: 0.0.1-combined.1
    - name: vcluster-chart-registry-secret-name
      value: infra-vcluster-registry-auth
    - name: vcluster-chart-registry-secret-namespace
      value: klape-llm-d-e2e
    - name: rhaii-git-repository
      value: https://github.com/opendatahub-io/odh-gitops.git
    - name: rhaii-git-revision
      value: af383937f4efd498a24f1128cde6a1779a70e69f
    - name: kubeconfig-secret-name
      value: llm-d-e2e-guest-kubeconfig
    - name: registry-auth-secret-name
      value: rhai-pull-secret
    - name: registry-auth-secret-namespace
      value: klape-llm-d-e2e
    - name: delete-vcluster
      value: "false"
  workspaces:
    - name: guest-kubeconfig
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
