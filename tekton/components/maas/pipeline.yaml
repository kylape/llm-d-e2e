apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-maas-install-validate
spec:
  description: >-
    Deploy the CPU simulator model and MaaS policy resources, then validate the
    resulting MaaS deployment. The bootstrap pipeline provisions the MaaS
    database before RHAII installation. Resources are intentionally retained
    after the PipelineRun as validation fixtures.
  params:
    - name: simulator-image
      type: string
      default: ghcr.io/llm-d/llm-d-inference-sim@sha256:fced8f42b98b18b72d0cd452b5c1121edcef9849e73918e25536f795c94a2285
    - name: simulator-model
      type: string
      default: facebook/opt-125m
  workspaces:
    - name: guest-kubeconfig
  tasks:
    - name: deploy-simulator-and-policies
      taskSpec:
        params:
          - name: simulator-image
            type: string
          - name: simulator-model
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: apply
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              export KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              kubectl create namespace llm --dry-run=client -o yaml | kubectl apply -f -
              kubectl create namespace models-as-a-service --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -f - <<EOF
              apiVersion: serving.kserve.io/v1alpha1
              kind: LLMInferenceService
              metadata:
                name: facebook-opt-125m-simulated
                namespace: llm
              spec:
                model:
                  uri: hf://placeholder/no-model
                  name: $(params.simulator-model)
                storageInitializer:
                  enabled: false
                replicas: 1
                router:
                  route: {}
                  gateway:
                    refs:
                      - name: maas-default-gateway
                        namespace: redhat-ods-applications
                template:
                  containers:
                    - name: main
                      image: $(params.simulator-image)
                      imagePullPolicy: IfNotPresent
                      command: ["/app/llm-d-inference-sim"]
                      args: ["--port", "8000", "--model", "$(params.simulator-model)", "--mode", "random", "--no-mm-encoder-only", "--ssl-certfile", "/var/run/kserve/tls/tls.crt", "--ssl-keyfile", "/var/run/kserve/tls/tls.key"]
                      ports:
                        - name: https
                          containerPort: 8000
                          protocol: TCP
                      readinessProbe:
                        httpGet:
                          path: /health/ready
                          port: https
                          scheme: HTTPS
                      livenessProbe:
                        httpGet:
                          path: /health
                          port: https
                          scheme: HTTPS
              ---
              apiVersion: maas.opendatahub.io/v1alpha1
              kind: MaaSModelRef
              metadata:
                name: facebook-opt-125m-simulated
                namespace: llm
              spec:
                modelRef:
                  kind: LLMInferenceService
                  name: facebook-opt-125m-simulated
              ---
              apiVersion: maas.opendatahub.io/v1alpha1
              kind: MaaSSubscription
              metadata:
                name: simulator-subscription
                namespace: models-as-a-service
              spec:
                owner:
                  groups:
                    - name: system:authenticated
                modelRefs:
                  - name: facebook-opt-125m-simulated
                    namespace: llm
                    tokenRateLimits:
                      - limit: 100
                        window: 1m
                priority: 10
              ---
              apiVersion: maas.opendatahub.io/v1alpha1
              kind: MaaSAuthPolicy
              metadata:
                name: simulator-access
                namespace: models-as-a-service
              spec:
                modelRefs:
                  - name: facebook-opt-125m-simulated
                    namespace: llm
                subjects:
                  groups:
                    - name: system:authenticated
                  users: []
              EOF
              kubectl wait --for=condition=Ready \
                llminferenceservice/facebook-opt-125m-simulated \
                --namespace llm --timeout=20m
      params:
        - name: simulator-image
          value: $(params.simulator-image)
        - name: simulator-model
          value: $(params.simulator-model)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig
    - name: validate
      runAfter: [deploy-simulator-and-policies]
      taskSpec:
        params:
          - name: model-name
            type: string
          - name: model-namespace
            type: string
          - name: gateway-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: verify
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl jq
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              export KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              MODEL="$(params.model-name)"
              MODEL_NAMESPACE="$(params.model-namespace)"
              GATEWAY_NAMESPACE="$(params.gateway-namespace)"

              kubectl wait --for=create deployment/maas-api \
                --namespace redhat-ai-gateway-infra --timeout=10m
              kubectl rollout status deployment/maas-controller \
                --namespace "$GATEWAY_NAMESPACE" --timeout=10m
              kubectl rollout status deployment/maas-api \
                --namespace redhat-ai-gateway-infra --timeout=10m
              kubectl wait --for=condition=Programmed \
                gateway/maas-default-gateway \
                --namespace "$GATEWAY_NAMESPACE" --timeout=10m
              kubectl wait --for=condition=Ready \
                "llminferenceservice/$MODEL" \
                --namespace "$MODEL_NAMESPACE" --timeout=10m
              kubectl wait \
                --for='jsonpath={.status.parents[0].conditions[?(@.type=="Accepted")].status}=True' \
                "httproute/${MODEL}-kserve-route" \
                --namespace "$MODEL_NAMESPACE" --timeout=10m
              kubectl wait \
                --for='jsonpath={.status.parents[0].conditions[?(@.type=="ResolvedRefs")].status}=True' \
                "httproute/${MODEL}-kserve-route" \
                --namespace "$MODEL_NAMESPACE" --timeout=10m
              kubectl wait --for=jsonpath='{.status.phase}'=Ready \
                "maasmodelref/$MODEL" \
                --namespace "$MODEL_NAMESPACE" --timeout=10m
              test -n "$(kubectl get maasmodelref "$MODEL" \
                --namespace "$MODEL_NAMESPACE" -o jsonpath='{.status.endpoint}')"
              kubectl get maasmodelref,maassubscription,maasauthpolicy \
                --all-namespaces
      params:
        - name: model-name
          value: facebook-opt-125m-simulated
        - name: model-namespace
          value: llm
        - name: gateway-namespace
          value: redhat-ods-applications
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig
