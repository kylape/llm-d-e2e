apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-maas-validate
spec:
  description: >-
    Validate an already-installed MaaS deployment and retained simulator model.
    This PipelineRun is read-only and does not create or delete MaaS resources.
  params:
    - name: model-name
      type: string
      default: facebook-opt-125m-simulated
    - name: model-namespace
      type: string
      default: llm
    - name: gateway-namespace
      type: string
      default: redhat-ods-applications
  workspaces:
    - name: guest-kubeconfig
  tasks:
    - name: validate
      taskSpec:
        params:
          - name: model-name
            type: string
          - name: model-namespace
            type: string
          - name: gateway-namespace
            type: string
        workspaces:
          - name: guest-kubeconfig
        steps:
          - name: verify
            image: alpine/helm:3.19.0
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache ca-certificates curl jq
              curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl \
                -o /usr/local/bin/kubectl
              chmod +x /usr/local/bin/kubectl
              export KUBECONFIG="$(workspaces.guest-kubeconfig.path)/config"
              MODEL="$(params.model-name)"
              MODEL_NAMESPACE="$(params.model-namespace)"
              GATEWAY_NAMESPACE="$(params.gateway-namespace)"

              kubectl wait --for=create deployment/maas-api \
                --namespace redhat-ai-gateway-infra --timeout=10m
              kubectl rollout status deployment/maas-controller \
                --namespace "$GATEWAY_NAMESPACE" --timeout=10m
              kubectl rollout status deployment/maas-api \
                --namespace redhat-ai-gateway-infra --timeout=10m
              kubectl wait --for=condition=Programmed \
                gateway/maas-default-gateway \
                --namespace "$GATEWAY_NAMESPACE" --timeout=10m
              kubectl wait --for=condition=Ready \
                "llminferenceservice/$MODEL" \
                --namespace "$MODEL_NAMESPACE" --timeout=10m
              kubectl wait \
                --for='jsonpath={.status.parents[0].conditions[?(@.type=="Accepted")].status}=True' \
                "httproute/${MODEL}-kserve-route" \
                --namespace "$MODEL_NAMESPACE" --timeout=10m
              kubectl wait \
                --for='jsonpath={.status.parents[0].conditions[?(@.type=="ResolvedRefs")].status}=True' \
                "httproute/${MODEL}-kserve-route" \
                --namespace "$MODEL_NAMESPACE" --timeout=10m
              kubectl wait --for=jsonpath='{.status.phase}'=Ready \
                "maasmodelref/$MODEL" \
                --namespace "$MODEL_NAMESPACE" --timeout=10m
              test -n "$(kubectl get maasmodelref "$MODEL" \
                --namespace "$MODEL_NAMESPACE" -o jsonpath='{.status.endpoint}')"
              kubectl get maasmodelref,maassubscription,maasauthpolicy \
                --all-namespaces
      params:
        - name: model-name
          value: $(params.model-name)
        - name: model-namespace
          value: $(params.model-namespace)
        - name: gateway-namespace
          value: $(params.gateway-namespace)
      workspaces:
        - name: guest-kubeconfig
          workspace: guest-kubeconfig
