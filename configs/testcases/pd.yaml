name: pd
description: "P/D disaggregation, 2 prefill + 1 decode (default: Qwen/Qwen3-0.6B)"
model:
  name: Qwen/Qwen3-0.6B
  uri: hf://Qwen/Qwen3-0.6B
  display_name: qwen3-0.6b-pd
  category: multi-node-gpu
  cache:
    enabled: true
    storage_size: 10Gi
    keep_pvc: true
    timeout: 15m
deployment:
  manifest_path: pd.yaml
  replicas: 1
  ready_timeout: 15m
  resources:
    cpu: "4"
    memory: 32Gi
    gpus: 1
    rdma: false
  prefill:
    replicas: 2
    resources:
      cpu: "4"
      memory: 32Gi
      gpus: 1
      rdma: false
validation:
  health_endpoint: /health
  health_port: 8000
  health_scheme: HTTPS
  inference_check: true
  test_prompts:
    - "What is prefill decode disaggregation?"
    - "Explain KV cache transfer."
  expected_codes: [200]
  timeout: 2m
  retry_attempts: 3
  retry_interval: 15s
  metrics_check:
    enabled: true
    check_vllm: true
    check_pd: true
    check_nixl: true
    check_scheduler: true
cleanup: true
