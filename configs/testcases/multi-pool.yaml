name: multi-pool
description: "Multiple InferencePools — validates VirtualService merge across pools (OSSM-12585)"
model:
  name: Qwen/Qwen3-0.6B
  uri: hf://Qwen/Qwen3-0.6B
  display_name: multi-pool
  category: multi-pool
  cache:
    enabled: true
    storage_size: 10Gi
    keep_pvc: true
    timeout: 15m
deployment:
  manifest_path: multi-pool.yaml
  replicas: 1
  ready_timeout: 15m
  resources:
    cpu: "4"
    memory: 32Gi
    gpus: 2
    rdma: false
validation:
  health_endpoint: /health
  health_port: 8000
  health_scheme: HTTPS
  inference_check: true
  test_prompts:
    - "What is Kubernetes?"
  expected_codes: [200]
  timeout: 2m
  retry_attempts: 3
  retry_interval: 15s
  metrics_check:
    enabled: true
    check_vllm: true
    check_epp: true
    check_scheduler: true
  multi_pool:
    enabled: true
    pools:
      - name: multi-pool-a
        prompt: "What is Kubernetes?"
      - name: multi-pool-b
        prompt: "What is containerization?"
cleanup: true
