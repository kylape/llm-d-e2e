name: single-gpu-no-scheduler
description: "1 GPU without scheduler, K8s native routing (default: Qwen/Qwen3-0.6B)"
model:
  name: Qwen/Qwen3-0.6B
  uri: hf://Qwen/Qwen3-0.6B
  display_name: qwen3-0.6b-no-scheduler
  category: single-node-gpu
  cache:
    enabled: true
    storage_size: 100Gi
    keep_pvc: true
    timeout: 15m
deployment:
  manifest_path: single-gpu-no-scheduler.yaml
  replicas: 3
  ready_timeout: 15m
  resources:
    cpu: "4"
    memory: 32Gi
    gpus: 1
    rdma: false
validation:
  health_endpoint: /health
  health_port: 8000
  health_scheme: HTTPS
  inference_check: true
  test_prompts:
    - "What is Kubernetes?"
  expected_codes: [200]
  timeout: 2m
  retry_attempts: 3
  retry_interval: 15s
cleanup: true
