name: moe
description: "MoE with DP/EP, 8 GPUs, RDMA/RoCE (default: deepseek-ai/DeepSeek-R1-0528)"
model:
  name: deepseek-ai/DeepSeek-R1-0528
  uri: hf://deepseek-ai/DeepSeek-R1-0528
  display_name: deepseek-r1-0528
  category: deepseek
  cache:
    enabled: true
    storage_size: 500Gi
    keep_pvc: true
deployment:
  manifest_path: moe.yaml
  replicas: 1
  service_account: hfsa
  ready_timeout: 90m
  network_attach: roce-p2
  worker: true
  resources:
    cpu: "128"
    memory: 512Gi
    gpus: 8
    ephemeral_storage: 800Gi
    rdma: true
  parallelism:
    data: 32
    data_local: 8
    expert: true
    tensor: 1
validation:
  health_endpoint: /health
  health_port: 8000
  health_scheme: HTTPS
  inference_check: true
  test_prompts:
    - "What is expert parallelism in MoE models?"
  expected_codes: [200]
  timeout: 5m
  retry_attempts: 3
  retry_interval: 30s
cleanup: true
