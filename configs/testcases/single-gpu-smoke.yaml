name: single-gpu-smoke
description: "1 GPU fast smoke test (default: Qwen/Qwen3-0.6B)"
model:
  name: Qwen/Qwen3-0.6B
  uri: hf://Qwen/Qwen3-0.6B
  display_name: qwen3-0.6b-single
  category: single-node-gpu
  cache:
    enabled: true
    storage_size: 10Gi
    keep_pvc: true
    timeout: 15m
deployment:
  manifest_path: single-gpu-smoke.yaml
  replicas: 1
  ready_timeout: 10m
  resources:
    cpu: "2"
    memory: 8Gi
    gpus: 1
    rdma: false
validation:
  health_endpoint: /health
  health_port: 8000
  health_scheme: HTTPS
  inference_check: true
  test_prompts:
    - "What is 2+2?"
  expected_codes: [200]
  timeout: 2m
  retry_attempts: 3
  retry_interval: 15s
cleanup: true
