name: odh-fast-2
description: ODH TinyLlamaFast2Config assertions (see docs/odh-migration.md for parity limits)
labels:
- odh-port
model:
  name: TinyLlama
  uri: oci://quay.io/opendatahub/modelcar-vllm@sha256:45e325523fb05f122f6f27b29d0fe767bc9162a90563a15150c8d4773df4265d
  cache:
    enabled: false
deployment:
  manifestPath: bundled/odh-fast-2.yaml
  requiresGpu: true
  readyTimeout: 600s
  baseRefRegex: .*fast-2$
  baseRefAccelerator: nvidia.com/gpu
  baseRefTopology: workload-single-node
  baseRefOptional: true
validation:
  inferenceCheck: false
  odh:
    version: true
    compatibility: true
    inference: true
    expectedText: rome
    prompt: What is the capital of Italy?
    soakSeconds: 10
    minGpuNodes: 1
    gpusPerNode: 1
cleanup: true
