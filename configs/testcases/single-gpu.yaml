name: single-gpu
description: "1 GPU with scheduler (default: Qwen/Qwen3-0.6B)"
model:
  name: Qwen/Qwen3-0.6B
  uri: hf://Qwen/Qwen3-0.6B
  display_name: qwen3-0.6b-single-gpu
  category: single-node-gpu
  cache:
    enabled: true
    storage_size: 10Gi
    keep_pvc: true
    timeout: 15m
deployment:
  manifest_path: single-gpu.yaml
  replicas: 1
  ready_timeout: 15m
  resources:
    cpu: "4"
    memory: 32Gi
    gpus: 1
    rdma: false
validation:
  health_endpoint: /health
  health_port: 8000
  health_scheme: HTTPS
  inference_check: true
  test_prompts:
    - "What is Kubernetes?"
    - "Explain containerization."
  expected_codes: [200]
  timeout: 2m
  retry_attempts: 3
  retry_interval: 15s
  metrics_check:
    enabled: true
    check_vllm: true
    check_epp: true
    check_scheduler: true
cleanup: true
