name: odh-estimated-prefix
description: ODH EstimatedPrefixCacheConfig assertions (see docs/odh-migration.md for parity limits)
labels:
- odh-port
model:
  name: TinyLlama
  uri: hf://TinyLlama/TinyLlama-1.1B-Chat-v1.0
  cache:
    enabled: false
deployment:
  manifestPath: bundled/odh-estimated-prefix.yaml
  requiresGpu: true
  readyTimeout: 600s
validation:
  inferenceCheck: false
  odh:
    prefixCache: true
    compatibility: true
    inference: true
    expectedText: rome
    prompt: What is the capital of Italy?
    soakSeconds: 10
    topology:
      pods: 2
      pool: 2
    blockSize: 64
    indexDelay: 0
    minGpuNodes: 1
    gpusPerNode: 2
cleanup: true
