name: slo-single-gpu-qwen7b
description: "Single GPU Qwen2.5-7B-Instruct SLO validation on H200"

hardware: h200

model:
  name: Qwen/Qwen2.5-7B-Instruct
  uri: hf://Qwen/Qwen2.5-7B-Instruct
  display_name: qwen2.5-7b-instruct
  category: single-node-gpu
  cache:
    enabled: true
    storage_size: 20Gi
    keep_pvc: true
    timeout: 15m

deployment:
  manifest_path: single-gpu.yaml
  replicas: 1
  ready_timeout: 15m
  resources:
    cpu: "4"
    memory: 32Gi
    gpus: 1

benchmark:
  duration: 300
  concurrency: 64
  input_tokens_min: 128
  input_tokens_max: 1024
  output_tokens_min: 64
  output_tokens_max: 512
  profile: constant

slos:
  ttft_p95_ms: 200
  ttft_p99_ms: 500
  throughput_tok_s: 500
  itl_p95_ms: 30
  itl_p99_ms: 50
  error_rate: 0.01

validation:
  health_endpoint: /health
  health_port: 8000
  health_scheme: HTTPS
  inference_check: true
  test_prompts:
    - "What is Kubernetes?"
  expected_codes: [200]
  timeout: 2m
  retry_attempts: 3
  retry_interval: 15s
  metrics_check:
    enabled: true
    check_vllm: true
    check_epp: true
    check_scheduler: true

cleanup: true
