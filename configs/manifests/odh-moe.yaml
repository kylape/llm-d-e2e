# Ported from opendatahub-tests 92a93ed7188391ec70f4c522d72ea7bbf244b4e2
# llmd/llmd_configs/MultinodeMoeDpEpConfig; NVIDIA variant where applicable.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: odh-moe
  annotations:
    prometheus.io/port: '8000'
    prometheus.io/path: /metrics
    security.opendatahub.io/enable-auth: 'false'
spec:
  model:
    name: qwen3-moe-dummy
    uri: hf://threcc/qwen3-moe-dummy:93b3d84e2aa41d09bcd473fb8241f6bfa0a0363b
  replicas: 1
  template:
    containers:
    - name: main
      resources:
        limits:
          cpu: '2'
          memory: 64Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '1'
          memory: 32Gi
          nvidia.com/gpu: '1'
      env:
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
      startupProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 360
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 3600
        periodSeconds: 60
        timeoutSeconds: 60
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 360
  router:
    scheduler:
      configRef: kserve-config-llm-scheduler
    route: {}
    gateway: {}
  worker:
    containers:
    - name: main
      resources:
        limits:
          cpu: '2'
          memory: 64Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '1'
          memory: 32Gi
          nvidia.com/gpu: '1'
  parallelism:
    data: 2
    dataLocal: 1
    expert: true
