# Ported from opendatahub-tests 92a93ed7188391ec70f4c522d72ea7bbf244b4e2
# llmd/llmd_configs/KvCacheDiskOffloadConfig; NVIDIA variant where applicable.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: odh-kv-offload-disk
  annotations:
    prometheus.io/port: '8000'
    prometheus.io/path: /metrics
    security.opendatahub.io/enable-auth: 'false'
spec:
  model:
    name: TinyLlama
    uri: oci://quay.io/opendatahub/modelcar-vllm@sha256:45e325523fb05f122f6f27b29d0fe767bc9162a90563a15150c8d4773df4265d
  replicas: 1
  template:
    containers:
    - name: main
      resources:
        limits:
          cpu: '2'
          memory: 16Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '1'
          memory: 8Gi
          nvidia.com/gpu: '1'
      env:
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
      - name: VLLM_ADDITIONAL_ARGS
        value: --enable-auto-tool-choice --tool-call-parser hermes
      startupProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 360
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 3600
        periodSeconds: 60
        timeoutSeconds: 60
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 360
    volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 6Gi
  router:
    scheduler:
      configRef: kserve-config-llm-scheduler
    route: {}
    gateway: {}
  kvCacheOffloading:
    cpu: 4Gi
    secondary:
    - fileSystem:
        emptyDir:
          size: 20Gi
