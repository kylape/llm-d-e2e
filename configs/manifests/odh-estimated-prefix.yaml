# Ported from opendatahub-tests 92a93ed7188391ec70f4c522d72ea7bbf244b4e2
# llmd/llmd_configs/EstimatedPrefixCacheConfig; NVIDIA variant where applicable.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: odh-estimated-prefix
  annotations:
    prometheus.io/port: '8000'
    prometheus.io/path: /metrics
    security.opendatahub.io/enable-auth: 'false'
spec:
  model:
    name: TinyLlama
    uri: hf://TinyLlama/TinyLlama-1.1B-Chat-v1.0
  replicas: 2
  template:
    containers:
    - name: main
      resources:
        limits:
          cpu: '2'
          memory: 16Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '1'
          memory: 8Gi
          nvidia.com/gpu: '1'
      env:
      - name: MODEL_NAME
        value: TinyLlama
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
      - name: PYTHONHASHSEED
        value: '42'
      - name: VLLM_ADDITIONAL_ARGS
        value: --prefix-caching-hash-algo sha256 --block-size 64 --enable-auto-tool-choice --tool-call-parser hermes
      startupProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 360
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 3600
        periodSeconds: 60
        timeoutSeconds: 60
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 360
  router:
    scheduler:
      template:
        containers:
        - name: main
          args:
          - --v=4
          - --pool-name
          - '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
          - --pool-namespace
          - '{{ .ObjectMeta.Namespace }}'
          - --pool-group
          - inference.networking.x-k8s.io
          - --zap-encoder
          - json
          - --grpc-port
          - '9002'
          - --grpc-health-port
          - '9003'
          - --secure-serving
          - --model-server-metrics-scheme
          - https
          - --cert-path
          - /var/run/kserve/tls
          - --config-text
          - "apiVersion: inference.networking.x-k8s.io/v1alpha1\nkind: EndpointPickerConfig\nplugins:\n- parameters:\n\
            \    blockSize: 64\n    lruCapacityPerServer: 31250\n    maxPrefixBlocksToMatch: 256\n  type: prefix-cache-scorer\n\
            schedulingProfiles:\n- name: default\n  plugins:\n  - pluginRef: prefix-cache-scorer\n    weight: 5.0\n"
    route: {}
    gateway: {}
